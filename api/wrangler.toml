name = "inventory-forecast-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Paste the database_id printed by:  npx wrangler d1 create inventory-forecast
[[d1_databases]]
binding = "DB"
database_name = "inventory-forecast"
database_id = "9446b78e-5435-4256-aebf-b2e6c1771a37"

[vars]
# Comma-separated list of origins allowed to call this API.
# The GitHub Pages origin is the live UI; the localhost entries let a locally
# served copy of web/ talk to `wrangler dev`. Drop them if you never run it local.
ALLOWED_ORIGINS = "https://reciddice-ship-it.github.io,http://127.0.0.1:8080,http://localhost:8080"

# API_TOKEN is a SECRET, not a var. Never put it in this file.
# Set it with:  npx wrangler secret put API_TOKEN
